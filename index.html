<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceSync - AI Voice Task Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-microchip"></i>
                <h1>VoiceSync <span>AI</span></h1>
            </div>
            <p class="subtitle">Voice-to-Task Board Assistant</p>
        </header>

        <main>
            <div class="voice-section">
                <div class="mic-container">
                    <button id="micBtn" class="mic-btn">
                        <i class="fas fa-microphone"></i>
                        <div class="pulse-ring"></div>
                    </button>
                    <div id="statusText" class="status-text">Tap to Speak</div>
                    <div class="time-display">
                        <span id="currentTimeDisplay">00:00:00</span>
                        <button id="testNotifyBtn" title="Test Notification"><i class="fas fa-bell"></i></button>
                        <button id="simulateBtn" title="Simulate 10s Task"
                            style="margin-left: 5px; color: var(--accent); background: transparent; border: none; cursor: pointer;"><i
                                class="fas fa-magic"></i></button>
                    </div>
                </div>
                <div id="transcript" class="transcript-box">
                    <p id="transcriptText">Your speech will appear here...</p>
                </div>
            </div>

            <div class="task-section">
                <div class="section-header">
                    <h2>Your Tasks</h2>
                    <div class="task-count" id="taskCount">0</div>
                </div>
                <div id="taskList" class="task-list">
                    <!-- Tasks will be injected here -->
                    <div class="empty-state">
                        <i class="fas fa-tasks"></i>
                        <p>No tasks yet. Say something like "Buy groceries today and finish report tomorrow".</p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 VoiceSync AI. Powered by Groq.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
